<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Near By — stop 23012</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1a1d21; --muted: #6b7280;
    --live: #16a34a; --badge: #1d4ed8; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b1f26; --text:#e8eaed; --muted:#9aa1ab;
            --live:#34d399; --badge:#3b82f6; --border:#2a3038; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); overflow:hidden; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; height:100dvh;
          display:flex; flex-direction:column; }
  header h1 { font-size:1.05rem; margin:0; color:var(--muted); font-weight:500; }
  header .stop { font-size:1.4rem; font-weight:700; margin:2px 0 0; }
  header .sub { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
          margin-top:14px; overflow:hidden; flex:1; min-height:0;
          display:flex; flex-direction:column; }
  .row { display:flex; align-items:center; gap:12px; padding:6px 14px;
         border-bottom:1px solid var(--border); flex:1; min-height:0; }
  .row:last-child { border-bottom:none; }
  .badge { min-width:52px; text-align:center; background:var(--badge); color:#fff;
           border-radius:8px; font-weight:700; font-size:1.1rem; padding:6px 8px; }
  .info { flex:1; min-width:0; }
  .dest { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { color:var(--muted); font-size:.78rem; margin-top:2px; }
  .eta { text-align:right; }
  .eta .min { font-size:1.35rem; font-weight:700; }
  .eta .unit { font-size:.75rem; color:var(--muted); }
  .live-dot { display:inline-block; width:8px; height:8px; border-radius:50%;
              background:var(--live); margin-right:4px; animation:pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .status-live { color:var(--live); font-size:.75rem; font-weight:600; }
  .status-sched { color:var(--muted); font-size:.75rem; }
  footer { color:var(--muted); font-size:.75rem; margin-top:12px; line-height:1.5; }
  footer a { color:inherit; }
  .empty, .error { padding:24px; text-align:center; color:var(--muted); }
  .error { color:#dc2626; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Next buses at</h1>
    <div class="stop" id="stop-name">Loading…</div>
    <div class="sub" id="stop-sub"></div>
  </header>
  <div class="card" id="board"><div class="empty">Loading arrivals…</div></div>
  <footer><span id="updated"></span></footer>
</div>
<script>
const $ = id => document.getElementById(id);
const fmtTime = s => new Date(s).toLocaleTimeString("en-GB",
  { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Jerusalem" });

async function refresh() {
  try {
    const res = await fetch("/api/arrivals");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    render(data);
  } catch (e) {
    $("board").innerHTML = `<div class="error">Failed to load: ${e.message}</div>`;
  }
}

function render(data) {
  $("stop-name").textContent = data.stop.name;
  $("stop-sub").textContent = `Stop ${data.stop.code} · ${data.stop.city}`;
  const ageSec = Math.max(0, Math.round((Date.now() - new Date(data.data_at || data.updated_at)) / 1000));
  $("updated").textContent = `data ${ageSec}s old` +
    (data.error ? " (stale — refresh error)" : "");

  if (!data.arrivals.length) {
    $("board").innerHTML = `<div class="empty">No buses expected in the next 20 minutes.</div>`;
    return;
  }
  $("board").innerHTML = data.arrivals.slice(0, 8).map(a => {
    const live = a.status === "live";
    const mins = Math.max(0, Math.floor((new Date(a.eta) - Date.now()) / 60000));
    const status = live
      ? `<span class="status-live"><span class="live-dot"></span>live` +
        (a.delay_min > 1 ? ` · +${a.delay_min} min` : a.delay_min < -1 ? ` · ${a.delay_min} min` : "") +
        `</span>`
      : `<span class="status-sched">scheduled</span>`;
    const parts = [status, `ETA ${fmtTime(a.eta)}`];
    if (a.planned) parts.push(`planned ${fmtTime(a.planned)}`);
    if (a.agency) parts.push(a.agency);
    return `<div class="row">
      <div class="badge">${a.line}</div>
      <div class="info">
        <div class="dest">${a.destination}</div>
        <div class="meta">${parts.join(" · ")}</div>
      </div>
      <div class="eta">
        <div class="min">${mins === 0 ? "now" : mins}</div>
        <div class="unit">${mins === 0 ? "" : "min"}</div>
      </div>
    </div>`;
  }).join("");
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>

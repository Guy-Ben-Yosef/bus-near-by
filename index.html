<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Near By</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0d0d; overflow:hidden; }
  #stage { width:100vw; height:100vh; background:#0d0d0d; overflow:hidden; position:relative; }
  #canvas { width:1024px; height:768px; position:absolute; left:50%; top:50%;
            background:#0d0d0d; color:#e8e8e8; font-family:'IBM Plex Mono',monospace;
            box-sizing:border-box; display:flex; flex-direction:column; padding:30px 44px;
            overflow:hidden; }
  @keyframes bnb-scroll-once { from { transform:translateY(0); } to { transform:translateY(var(--scroll-end)); } }
  @keyframes bnb-marquee { from { transform:translateX(0); } to { transform:translateX(var(--marquee-end)); } }

  .hdr { display:flex; justify-content:space-between; align-items:baseline; flex:0 0 auto; }
  .hdr .title { font-size:26px; font-weight:600; letter-spacing:0.02em; }
  .hdr .clock { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }

  #content { flex:1 1 0; display:flex; gap:40px; min-height:0; }
  .col { flex:1 1 0; display:flex; flex-direction:column; min-width:0; margin-top:22px; }
  .dirhdr { display:flex; justify-content:space-between; align-items:baseline;
            border-bottom:1px solid #3a3a3a; padding-bottom:8px; }
  .dirhdr .dir { font-size:22px; font-weight:600; letter-spacing:0.04em; }
  .dirhdr .code { font-size:16px; color:#8a8a8a; }
  .colhdr { display:grid; grid-template-columns:72px 1fr 96px; font-size:14px; color:#8a8a8a;
            letter-spacing:0.08em; padding:8px 0 6px; border-bottom:1px solid #222222; }
  .colhdr .min-h { text-align:right; }
  .rows-vp { height:540px; overflow:hidden; }
  .row { display:grid; grid-template-columns:72px 1fr 96px; align-items:center; height:90px;
         box-sizing:border-box; border-bottom:1px solid #1c1c1c; }
  .row .line { font-size:30px; font-weight:700; }
  .row .mid { min-width:0; }
  .row .dest { display:block; font-size:22px; white-space:nowrap; overflow:hidden; }
  .row .dest .dest-track { display:inline-flex; white-space:nowrap; }
  .row .dest .dest-track.scrolling { animation-name:bnb-marquee; animation-timing-function:linear;
                                      animation-iteration-count:infinite; }
  .row .meta { display:block; font-size:15px; color:#6a6a6a; margin-top:2px; }
  .row .min { text-align:right; font-size:34px; font-weight:700;
              font-variant-numeric:tabular-nums; }
  .empty { height:540px; display:flex; align-items:center; justify-content:center;
           font-size:17px; color:#6a6a6a; text-align:center; }

  .err { flex:1 1 0; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; text-align:center; }
  .err .t { font-size:30px; font-weight:600; }
  .err .s { font-size:18px; color:#8a8a8a; }

  .ftr { flex:0 0 auto; display:flex; justify-content:space-between; font-size:14px;
         color:#6a6a6a; border-top:1px solid #3a3a3a; padding-top:10px; margin-top:16px; }
  .ftr .page { white-space:pre; color:#9a9a9a; }
</style>
</head>
<body>
<div id="stage">
  <div id="canvas">
    <div class="hdr">
      <span class="title">BUS NEAR BY · MILANO SQUARE</span>
      <span class="clock" id="clock"></span>
    </div>
    <div id="content"></div>
    <div class="ftr">
      <span><span style="color:#8fbc8f">■</span> LIVE · <span style="color:#d99a4e">■</span> LIVE, UPDATE DELAYED · <span style="color:#9a9a9a">■</span> SCHEDULED</span>
      <span class="page" id="page-label"></span>
      <span>NEXT 10 MIN · REFRESH 15S</span>
    </div>
  </div>
</div>
<script>
const PAGES = [
  [{ code: "25893", direction: "SOUTHBOUND", arrow: "↓" },
   { code: "23012", direction: "NORTHBOUND", arrow: "↑" }],
  [{ code: "20676", direction: "WESTBOUND", arrow: "←" },
   { code: "25894", direction: "EASTBOUND", arrow: "→" }],
];
const PAGE_LABELS = ["[ N/S ]  E/W ", "  N/S  [ E/W ]"];
const FLAP_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const VISIBLE_ROWS = 6;                      // rows in the 540px viewport
const PAGE_SECONDS = 15;                     // screen transition cadence
const SCROLL_FINISH_S = PAGE_SECONDS - 1;    // scrolling ends 1s before the transition
const SCROLL_ROW_S = 2;                      // pace: seconds per hidden row
const SCROLL_START_MIN_S = 3;                // always leave time to read the top rows
const MARQUEE_SPEED_PX_S = 18;               // destination text scroll speed (slow, legible)
const MARQUEE_GAP_PX = 60;                   // gap between the tail and the repeated head
const MARQUEE_EPOCH = Date.now();            // shared clock so re-renders don't restart the scroll

let stopsData = {};        // code -> [{line, destination, operator, due, live, updatedAt}]
let page = 0;
let pageShownAt = Date.now();
let flapP = null;          // split-flap progress 0..1, null when idle
let error = false;
let lastGood = null;
let transitioning = false;
let flapTimer = null;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function flap(str) {
  if (flapP == null || !str) return str;
  let out = "";
  for (let i = 0; i < str.length; i++) {
    const settle = 0.15 + (i / Math.max(1, str.length)) * 0.8;
    out += (flapP >= settle || str[i] === " ")
      ? str[i] : FLAP_CHARS[Math.floor(Math.random() * FLAP_CHARS.length)];
  }
  return out;
}

async function fetchData() {
  try {
    const res = await fetch("/api/arrivals");
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    stopsData = {};
    for (const [code, list] of Object.entries(data.stops)) {
      stopsData[code] = list.map(b => ({
        line: b.line, destination: b.destination, operator: b.operator,
        due: new Date(b.eta), live: b.live,
        updatedAt: b.updated_at ? new Date(b.updated_at) : null,
      }));
    }
    lastGood = Date.now();
    error = false;
  } catch (e) {
    error = true;
  }
  render();
}

function startTransition() {
  if (transitioning) return;          // guard against overlapping transitions
  transitioning = true;
  setTimeout(() => { transitioning = false; }, 2000);
  page = 1 - page;                    // swap data instantly, then scramble 1.5s
  pageShownAt = Date.now();
  const t0 = Date.now();
  clearInterval(flapTimer);
  flapTimer = setInterval(() => {
    const p = (Date.now() - t0) / 1500;
    if (p >= 1) { clearInterval(flapTimer); flapP = null; render(); return; }
    flapP = p;
    render();
  }, 70);
  render();
}

function buildStop(stop) {
  const now = Date.now();
  const list = (stopsData[stop.code] || [])
    .map(b => ({ ...b, mins: (b.due - now) / 60000 }))
    .filter(b => b.mins > -0.75 && b.mins <= 10)
    .sort((a, b) => a.mins - b.mins);

  const rowsHtml = list.map(b => {
    const isNow = b.mins < 1;
    const updAge = b.updatedAt ? (now - b.updatedAt) / 1000 : Infinity;
    const minsColor = !b.live ? "#9a9a9a" : (updAge <= 45 ? "#8fbc8f" : "#d99a4e");
    const rowColor = b.live ? "#e8e8e8" : "#9a9a9a";
    const statusColor = b.live ? "#c9c9c9" : "#6a6a6a";
    const eta = b.due.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    const minsText = isNow ? "NOW" : String(Math.max(0, Math.round(b.mins)));
    return `<div class="row">
      <span class="line">${esc(flap(b.line))}</span>
      <span class="mid">
        <span class="dest" style="color:${rowColor}"><span class="dest-track"><span class="dest-text">${esc(flap(b.destination))}</span></span></span>
        <span class="meta">${flap(eta)} · <span style="color:${statusColor}">${flap(b.live ? "LIVE" : "SCHD")}</span> · ${esc(flap(b.operator))}</span>
      </span>
      <span class="min" style="color:${minsColor}">${flap(minsText)}</span>
    </div>`;
  }).join("");

  // Single-pass scroll: hold on the top rows, scroll once, reach the end at
  // SCROLL_FINISH_S (1s before the screen transition) and stop there.
  let style = "";
  if (list.length > VISIBLE_ROWS) {
    const dist = (list.length - VISIBLE_ROWS) * 90;
    const dur = Math.min((list.length - VISIBLE_ROWS) * SCROLL_ROW_S, SCROLL_FINISH_S - SCROLL_START_MIN_S);
    const start = SCROLL_FINISH_S - dur;
    const elapsed = (now - pageShownAt) / 1000;
    // Always attach the animation; a positive delay lets the browser start it
    // at exactly the right moment (smooth), instead of waiting for the next
    // 1s render tick and jumping mid-scroll.
    style = `--scroll-end:-${dist}px;animation:bnb-scroll-once ${dur}s linear forwards;`
          + `animation-delay:${(start - elapsed).toFixed(3)}s`;
  }

  const body = list.length
    ? `<div class="rows-vp"><div style="${style}">${rowsHtml}</div></div>`
    : `<div class="empty">NO BUSES EXPECTED IN THE NEXT 10 MINUTES</div>`;

  return `<div class="col">
    <div class="dirhdr">
      <span class="dir">${stop.arrow} ${flap(stop.direction)}</span>
      <span class="code">STOP #${flap(stop.code)}</span>
    </div>
    <div class="colhdr"><span>LINE</span><span>DESTINATION</span><span class="min-h">MIN</span></div>
    ${body}
  </div>`;
}

function render() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-GB",
    { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  document.getElementById("page-label").textContent = PAGE_LABELS[page];

  const content = document.getElementById("content");
  if (error) {
    const age = lastGood == null ? null : Math.floor((Date.now() - lastGood) / 1000);
    const ageText = age == null ? "—" : (age < 60 ? age + "S" : Math.floor(age / 60) + " MIN");
    content.innerHTML = `<div class="err">
      <div class="t">ARRIVAL DATA UNAVAILABLE</div>
      <div class="s">LAST UPDATE ${ageText} AGO · ATTEMPTING RECONNECT</div>
    </div>`;
    return;
  }
  content.innerHTML = PAGES[page].map(buildStop).join("");
  applyMarquee();
}

function applyMarquee() {
  // Seamless head-to-tail loop: duplicate the text once, gap between the
  // copies, then scroll left by exactly one copy's width forever — when the
  // first copy exits, the second is sitting exactly where the first began.
  const elapsed = (Date.now() - MARQUEE_EPOCH) / 1000;
  document.querySelectorAll(".dest").forEach(container => {
    const track = container.querySelector(".dest-track");
    const textEl = track.querySelector(".dest-text");
    const overflow = textEl.scrollWidth - container.clientWidth;
    if (overflow <= 1) return;
    track.appendChild(textEl.cloneNode(true));
    track.style.gap = `${MARQUEE_GAP_PX}px`;
    const unit = textEl.getBoundingClientRect().width + MARQUEE_GAP_PX;
    const dur = Math.max(unit / MARQUEE_SPEED_PX_S, 3);
    track.style.setProperty("--marquee-end", `-${unit}px`);
    track.style.animationDuration = `${dur.toFixed(2)}s`;
    track.style.animationDelay = `-${(elapsed % dur).toFixed(3)}s`;
    track.classList.add("scrolling");
  });
}

function fit() {
  const s = Math.min(window.innerWidth / 1024, window.innerHeight / 768);
  document.getElementById("canvas").style.transform = `translate(-50%,-50%) scale(${s})`;
}

window.addEventListener("resize", fit);
fit();
fetchData();
setInterval(render, 1000);
setInterval(fetchData, 15000);
setInterval(startTransition, PAGE_SECONDS * 1000);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Near By</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0d0d; overflow:hidden; }
  #stage { width:100vw; height:100vh; background:#0d0d0d; overflow:hidden; position:relative; }
  #canvas { width:1024px; height:768px; position:absolute; left:50%; top:50%;
            background:#0d0d0d; color:#e8e8e8; font-family:'IBM Plex Mono',monospace;
            box-sizing:border-box; display:flex; flex-direction:column; padding:30px 44px;
            overflow:hidden; }
  @keyframes bnb-scroll-once { from { transform:translateY(0); } to { transform:translateY(var(--scroll-end)); } }
  @keyframes bnb-marquee { from { transform:translateX(0); } to { transform:translateX(var(--marquee-end)); } }

  .hdr { display:flex; justify-content:space-between; align-items:baseline; flex:0 0 auto; }
  .hdr .title { font-size:26px; font-weight:600; letter-spacing:0.02em; }
  .hdr .clock { font-size:31px; font-weight:600; font-variant-numeric:tabular-nums; }
  .hdr .clock .date { color:#8a8a8a; }

  #content { flex:1 1 0; display:flex; gap:40px; min-height:0; }
  .col { flex:1 1 0; display:flex; flex-direction:column; min-width:0; margin-top:22px; }
  .dirhdr { display:flex; justify-content:space-between; align-items:baseline;
            border-bottom:1px solid #3a3a3a; padding-bottom:8px; }
  .dirhdr .dir { font-size:22px; font-weight:600; letter-spacing:0.04em; }
  .dirhdr .code { font-size:16px; color:#8a8a8a; }
  .colhdr { display:grid; grid-template-columns:72px 1fr 96px; font-size:14px; color:#8a8a8a;
            letter-spacing:0.08em; padding:8px 0 6px; border-bottom:1px solid #222222; }
  .colhdr .min-h { text-align:right; }
  .rows-vp { height:540px; overflow:hidden; }
  .row { display:grid; grid-template-columns:72px 1fr 96px; align-items:center; height:90px;
         box-sizing:border-box; border-bottom:1px solid #1c1c1c; }
  .row .line { font-size:30px; font-weight:700; }
  .row .mid { min-width:0; }
  .row .dest { display:block; font-size:22px; white-space:nowrap; overflow:hidden; }
  .row .dest .dest-track { display:inline-flex; white-space:nowrap; }
  .row .dest .dest-track.scrolling { animation-name:bnb-marquee; animation-timing-function:linear;
                                      animation-iteration-count:infinite; }
  .row .meta { display:block; font-size:15px; color:#6a6a6a; margin-top:2px; }
  .row .min { text-align:right; font-size:34px; font-weight:700;
              font-variant-numeric:tabular-nums; }
  .empty { height:540px; display:flex; align-items:center; justify-content:center;
           font-size:17px; color:#6a6a6a; text-align:center; }

  .err { flex:1 1 0; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; text-align:center; }
  .err .t { font-size:30px; font-weight:600; }
  .err .s { font-size:18px; color:#8a8a8a; }

  /* Weather screen (page 3): hero-centered clock, date, conditions, rain timeline */
  .wx { flex:1 1 0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; min-height:0; text-align:center; }
  .wx-time { font-size:150px; font-weight:700; line-height:0.82;
             font-variant-numeric:tabular-nums; letter-spacing:0.01em; }
  .wx-time .wx-sec { font-size:50px; font-weight:600; color:#8a8a8a;
                     margin-left:12px; vertical-align:top; }
  .wx-date { font-size:36px; font-weight:600; color:#c9c9c9; letter-spacing:0.08em; margin-top:14px; }
  .wx-cond { font-size:24px; font-weight:600; color:#e8e8e8; margin-top:20px; letter-spacing:0.03em; }

  .wx-cel { display:flex; align-items:center; justify-content:center; gap:40px; margin-top:30px; }
  .wx-sun { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .wx-sun-arc { width:186px; height:auto; }
  .wx-sun-times { display:flex; justify-content:space-between; width:172px;
                  font-size:18px; color:#8a8a8a; font-variant-numeric:tabular-nums; letter-spacing:0.02em; }
  .wx-cel-div { width:1px; height:84px; background:#3a3a3a; }
  .wx-moon { display:flex; align-items:center; gap:16px; }
  .wx-moon-disc { width:66px; height:66px; }
  .wx-moon-txt .nm { font-size:20px; font-weight:600; letter-spacing:0.03em; }
  .wx-moon-txt .il { font-size:16px; color:#8a8a8a; margin-top:5px; letter-spacing:0.04em; }

  .wx-hum { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .wx-hum-top { display:flex; align-items:baseline; gap:9px; }
  .wx-hum-dot { width:11px; height:11px; border-radius:50%; align-self:center; }
  .wx-hum-val { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .wx-hum-lbl { font-size:13px; color:#8a8a8a; letter-spacing:0.1em; }
  .wx-hum-spark { width:132px; height:38px; display:block; }
  .wx-hum-foot { font-size:12px; color:#6a6a6a; letter-spacing:0.08em; }

  .wx-rain { width:640px; margin-top:30px; }
  .wx-rain-head { display:flex; justify-content:center; gap:14px; align-items:baseline;
                  font-size:18px; color:#8a8a8a; letter-spacing:0.08em; padding-bottom:10px; }
  .wx-rain-head .hl { font-size:22px; font-weight:700; letter-spacing:0.04em; }
  .wx-bars { display:flex; align-items:flex-end; gap:8px; height:76px;
             border-top:1px solid #222222; padding-top:14px; }
  .wx-bar { flex:1 1 0; border-radius:2px 2px 0 0; min-height:4px; }
  .wx-axis { display:flex; justify-content:space-between; font-size:14px; color:#6a6a6a;
             letter-spacing:0.08em; margin-top:8px; }

  .ftr { flex:0 0 auto; display:flex; justify-content:space-between; font-size:14px;
         color:#6a6a6a; border-top:1px solid #3a3a3a; padding-top:10px; margin-top:16px; }
  .ftr .page { white-space:pre; color:#9a9a9a; }
</style>
</head>
<body>
<div id="stage">
  <div id="canvas">
    <div class="hdr">
      <span class="title">BUS NEAR BY · MILANO SQUARE</span>
      <span class="clock" id="clock"><span id="clock-time"></span> <span class="date" id="clock-date"></span></span>
    </div>
    <div id="content"></div>
    <div class="ftr">
      <span id="ftr-left"></span>
      <span class="page" id="page-label"></span>
      <span id="ftr-right"></span>
    </div>
  </div>
</div>
<script>
const PAGES = [
  [{ code: "25893", direction: "SOUTHBOUND", arrow: "↓" },
   { code: "23012", direction: "NORTHBOUND", arrow: "↑" }],
  [{ code: "20676", direction: "WESTBOUND", arrow: "←" },
   { code: "25894", direction: "EASTBOUND", arrow: "→" }],
];
const PAGE_LABELS = ["[ N/S ]  E/W   WX ", "  N/S  [ E/W ]  WX ", "  N/S   E/W  [ WX ]"];
const PAGE_COUNT = 3;                        // N/S, E/W, weather
const WEATHER_PAGE = 2;
const FTR_LEGEND = '<span style="color:#8fbc8f">■</span> LIVE · <span style="color:#d99a4e">■</span> LIVE, UPDATE DELAYED · <span style="color:#9a9a9a">■</span> SCHEDULED';
const FTR_NOTE = "NEXT 10 MIN · REFRESH 15S";
const FLAP_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
// Bathroom humidity. The status light is decided server-side (it needs a day
// of history for the rolling baseline); the board just paints the verdict.
const HUM_SCALE = [40, 95];                  // sparkline y-range, %
const HUM_COLORS = { green: "#8fbc8f", amber: "#d99a4e", red: "#c25b4e" };
const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const pad2 = n => String(n).padStart(2, "0");
// This is a Tel Aviv board: always show clock, date, ETAs, and sun/moon times
// in its own timezone, whatever the host clock is set to (the Pi runs UTC/BST).
const TZ = "Asia/Jerusalem";
const HM = { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: TZ };
const HMS = { ...HM, second: "2-digit" };
const fmtHM = d => d.toLocaleTimeString("en-GB", HM);
function tzParts(d) {
  const f = new Intl.DateTimeFormat("en-GB", {
    timeZone: TZ, weekday: "short", day: "2-digit", month: "2-digit", year: "numeric",
  }).formatToParts(d);
  const g = t => f.find(p => p.type === t).value;
  return { wd: g("weekday").toUpperCase(), day: g("day"), mon: +g("month"), year: g("year") };
}
const fmtDate = (d, withYear) => {
  const p = tzParts(d);
  return `${p.wd} ${p.day} ${MON[p.mon - 1]}` + (withYear ? ` ${p.year}` : "");
};
const fmtLocalHM = iso => iso ? new Date(iso).toLocaleTimeString("en-GB", HM) : "—";

// Moon phase from date alone (no API): age within the synodic month gives the
// illuminated fraction and whether it's waxing (growing) or waning.
function moonInfo(date) {
  const SYNODIC = 29.530588853;                         // days, new moon to new moon
  const KNOWN_NEW = Date.UTC(2000, 0, 6, 18, 14, 0) / 86400000;
  let phase = ((date.getTime() / 86400000 - KNOWN_NEW) / SYNODIC) % 1;
  if (phase < 0) phase += 1;
  const illum = (1 - Math.cos(2 * Math.PI * phase)) / 2; // 0 new .. 1 full
  const waxing = phase < 0.5;
  let name;
  if (phase < 0.033 || phase > 0.967) name = "NEW MOON";
  else if (phase < 0.217) name = "WAXING CRESCENT";
  else if (phase < 0.283) name = "FIRST QUARTER";
  else if (phase < 0.467) name = "WAXING GIBBOUS";
  else if (phase < 0.533) name = "FULL MOON";
  else if (phase < 0.717) name = "WANING GIBBOUS";
  else if (phase < 0.783) name = "LAST QUARTER";
  else name = "WANING CRESCENT";
  return { phase, illum, waxing, name };
}
const VISIBLE_ROWS = 6;                      // rows in the 540px viewport
const PAGE_SECONDS = 15;                     // screen transition cadence
const SCROLL_FINISH_S = PAGE_SECONDS - 1;    // scrolling ends 1s before the transition
const SCROLL_ROW_S = 2;                      // pace: seconds per hidden row
const SCROLL_START_MIN_S = 3;                // always leave time to read the top rows
const MARQUEE_SPEED_PX_S = 18;               // destination text scroll speed (slow, legible)
const MARQUEE_GAP_PX = 60;                   // gap between the tail and the repeated head
const MARQUEE_EPOCH = Date.now();            // shared clock so re-renders don't restart the scroll

let stopsData = {};        // code -> [{line, destination, operator, due, live, updatedAt}]
let weather = null;        // {temp, feels, humidity, wind, condition, rain:[{t,mm,prob}], updated_at}
let weatherError = false;
let climate = null;        // {humidity, temperature, at, age_sec, stale, series:[{t,h}]}
let climateError = false;
let page = 0;
let pageShownAt = Date.now();
let flapP = null;          // split-flap progress 0..1, null when idle
let error = false;
let lastGood = null;
let transitioning = false;
let flapTimer = null;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function flap(str) {
  if (flapP == null || !str) return str;
  let out = "";
  for (let i = 0; i < str.length; i++) {
    const settle = 0.15 + (i / Math.max(1, str.length)) * 0.8;
    out += (flapP >= settle || str[i] === " ")
      ? str[i] : FLAP_CHARS[Math.floor(Math.random() * FLAP_CHARS.length)];
  }
  return out;
}

async function fetchData() {
  try {
    const res = await fetch("/api/arrivals");
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    stopsData = {};
    for (const [code, list] of Object.entries(data.stops)) {
      stopsData[code] = list.map(b => ({
        line: b.line, destination: b.destination, operator: b.operator,
        due: new Date(b.eta), live: b.live,
        updatedAt: b.updated_at ? new Date(b.updated_at) : null,
      }));
    }
    lastGood = Date.now();
    error = false;
  } catch (e) {
    error = true;
  }
  render();
}

async function fetchWeather() {
  try {
    const res = await fetch("/api/weather");
    if (!res.ok) throw new Error(res.status);
    weather = await res.json();
    weatherError = false;
  } catch (e) {
    weatherError = true;
  }
  if (page === WEATHER_PAGE) render();
}

async function fetchClimate() {
  try {
    const res = await fetch("/api/climate");
    if (!res.ok) throw new Error(res.status);
    climate = await res.json();
    climateError = false;
  } catch (e) {
    climateError = true;
  }
  if (page === WEATHER_PAGE) render();
}

function startTransition() {
  if (transitioning) return;          // guard against overlapping transitions
  transitioning = true;
  setTimeout(() => { transitioning = false; }, 2000);
  page = (page + 1) % PAGE_COUNT;     // advance N/S -> E/W -> WX, then scramble 1.5s
  pageShownAt = Date.now();
  const t0 = Date.now();
  clearInterval(flapTimer);
  flapTimer = setInterval(() => {
    const p = (Date.now() - t0) / 1500;
    if (p >= 1) { clearInterval(flapTimer); flapP = null; render(); return; }
    flapP = p;
    render();
  }, 70);
  render();
}

function buildStop(stop) {
  const now = Date.now();
  const list = (stopsData[stop.code] || [])
    .map(b => ({ ...b, mins: (b.due - now) / 60000 }))
    .filter(b => b.mins > -0.75 && b.mins <= 10)
    .sort((a, b) => a.mins - b.mins);

  const rowsHtml = list.map(b => {
    const isNow = b.mins < 1;
    const updAge = b.updatedAt ? (now - b.updatedAt) / 1000 : Infinity;
    const minsColor = !b.live ? "#9a9a9a" : (updAge <= 45 ? "#8fbc8f" : "#d99a4e");
    const rowColor = b.live ? "#e8e8e8" : "#9a9a9a";
    const statusColor = b.live ? "#c9c9c9" : "#6a6a6a";
    const eta = fmtHM(b.due);
    const minsText = isNow ? "NOW" : String(Math.max(0, Math.round(b.mins)));
    return `<div class="row">
      <span class="line">${esc(flap(b.line))}</span>
      <span class="mid">
        <span class="dest" style="color:${rowColor}"><span class="dest-track"><span class="dest-text">${esc(flap(b.destination))}</span></span></span>
        <span class="meta">${flap(eta)} · <span style="color:${statusColor}">${flap(b.live ? "LIVE" : "SCHD")}</span> · ${esc(flap(b.operator))}</span>
      </span>
      <span class="min" style="color:${minsColor}">${flap(minsText)}</span>
    </div>`;
  }).join("");

  // Single-pass scroll: hold on the top rows, scroll once, reach the end at
  // SCROLL_FINISH_S (1s before the screen transition) and stop there.
  let style = "";
  if (list.length > VISIBLE_ROWS) {
    const dist = (list.length - VISIBLE_ROWS) * 90;
    const dur = Math.min((list.length - VISIBLE_ROWS) * SCROLL_ROW_S, SCROLL_FINISH_S - SCROLL_START_MIN_S);
    const start = SCROLL_FINISH_S - dur;
    const elapsed = (now - pageShownAt) / 1000;
    // Always attach the animation; a positive delay lets the browser start it
    // at exactly the right moment (smooth), instead of waiting for the next
    // 1s render tick and jumping mid-scroll.
    style = `--scroll-end:-${dist}px;animation:bnb-scroll-once ${dur}s linear forwards;`
          + `animation-delay:${(start - elapsed).toFixed(3)}s`;
  }

  const body = list.length
    ? `<div class="rows-vp"><div style="${style}">${rowsHtml}</div></div>`
    : `<div class="empty">${flap("NO BUSES EXPECTED IN THE NEXT 10 MINUTES")}</div>`;

  return `<div class="col">
    <div class="dirhdr">
      <span class="dir">${stop.arrow} ${flap(stop.direction)}</span>
      <span class="code">STOP #${flap(stop.code)}</span>
    </div>
    <div class="colhdr"><span>LINE</span><span>DESTINATION</span><span class="min-h">MIN</span></div>
    ${body}
  </div>`;
}

function buildHumidity() {
  // Hidden entirely (divider and all) when the sensor feed is unavailable.
  if (climateError || !climate || climate.humidity == null) return "";
  const pct = climate.humidity;
  const color = climate.stale ? "#6a6a6a" : (HUM_COLORS[climate.status] || "#8fbc8f");

  // Plot against real time, not sample index, so sensor gaps read as gaps.
  const W = 132, H = 38, [LO, HI] = HUM_SCALE;
  const pts = [];
  const end = new Date(climate.at).getTime();
  const span = (climate.window_min || 60) * 60000;
  for (const p of (climate.series || [])) {
    const x = ((new Date(p.t).getTime() - (end - span)) / span) * W;
    const y = H - ((Math.max(LO, Math.min(HI, p.h)) - LO) / (HI - LO)) * H;
    pts.push([Math.max(0, Math.min(W, x)), y]);
  }
  let chart = "";
  if (pts.length > 1) {
    const line = "M " + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ");
    const last = pts[pts.length - 1];
    chart = `<path d="${line} L ${last[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z"
                   fill="${color}" fill-opacity="0.13"/>
             <path d="${line}" stroke="${color}" stroke-width="2"
                   stroke-linejoin="round" stroke-linecap="round"/>
             <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.8" fill="${color}"/>`;
  }

  // The red state is the one worth acting on, so it says what to do.
  const mins = Math.round(climate.elevated_min || 0);
  const foot = climate.stale ? "SENSOR OFFLINE"
             : climate.status === "red" ? "OPEN THE WINDOW"
             : climate.status === "amber" ? "DRYING · " + mins + " MIN"
             : "LAST 60 MIN";
  return `<div class="wx-cel-div"></div>
    <div class="wx-hum">
      <div class="wx-hum-top">
        <span class="wx-hum-dot" style="background:${color}"></span>
        <span class="wx-hum-val" style="color:${color}">${flap(Math.round(pct) + "%")}</span>
        <span class="wx-hum-lbl">${flap("BATHROOM")}</span>
      </div>
      <svg class="wx-hum-spark" viewBox="0 0 ${W} ${H}" fill="none" preserveAspectRatio="none">${chart}</svg>
      <div class="wx-hum-foot">${flap(foot)}</div>
    </div>`;
}

function buildWeather() {
  if (weatherError || !weather) {
    return `<div class="err">
      <div class="t">${flap("WEATHER DATA UNAVAILABLE")}</div>
      <div class="s">ATTEMPTING RECONNECT</div>
    </div>`;
  }
  const w = weather, now = new Date();
  const time = fmtHM(now);
  const sec = pad2(now.getSeconds());   // seconds are identical in every timezone
  const date = fmtDate(now, true);

  const temp = w.temp == null ? "—" : w.temp + "°";
  const parts = [temp + " · " + (w.condition || "—")];
  if (w.feels != null) parts.push("FEELS " + w.feels + "°");
  if (w.humidity != null) parts.push("HUMIDITY " + w.humidity + "%");
  const condLine = parts.join(" · ");

  // Rain timeline: 15-min buckets over the next 2h. Orange = rain expected,
  // gray = dry; bar height tracks intensity (mm) or, absent that, probability.
  const rain = w.rain || [];
  let firstRain = -1;
  for (let i = 0; i < rain.length; i++) {
    if ((rain[i].mm || 0) > 0.05 || (rain[i].prob || 0) >= 25) { firstRain = i; break; }
  }
  let head, headColor;
  if (firstRain < 0) { head = "NO RAIN NEXT 2H"; headColor = "#8fbc8f"; }
  else {
    const mins = Math.round((new Date(rain[firstRain].t) - now) / 60000);
    head = mins <= 7 ? "RAIN NOW" : "RAIN IN ~" + (Math.round(mins / 5) * 5) + " MIN";
    headColor = "#d99a4e";
  }
  const bars = rain.map(b => {
    const mm = b.mm || 0, prob = b.prob || 0;
    const level = Math.max(Math.min(1, mm / 1.2), (prob / 100) * 0.9);
    const h = Math.round(4 + level * 96);
    const rainy = mm > 0.05 || prob >= 25;
    return `<div class="wx-bar" style="height:${h}%;background:${rainy ? "#d99a4e" : "#3a3a3a"}"></div>`;
  }).join("");

  // Sun arc: a dot riding a half-circle from sunrise (left) to sunset (right),
  // at the fraction of daylight elapsed. Orange by day, gray after dark.
  const sr = w.sunrise ? new Date(w.sunrise) : null;
  const ss = w.sunset ? new Date(w.sunset) : null;
  let f = 0.5, isDay = false;
  if (sr && ss && ss > sr) {
    const raw = (now - sr) / (ss - sr);
    isDay = raw >= 0 && raw <= 1;
    f = Math.max(0, Math.min(1, raw));
  }
  const R = 78;
  const sunX = (R * Math.cos(Math.PI * (1 - f))).toFixed(1);
  const sunY = (-R * Math.sin(Math.PI * (1 - f))).toFixed(1);
  const sunColor = isDay ? "#d99a4e" : "#6a6a6a";
  const sunSvg = `<svg class="wx-sun-arc" viewBox="-94 -94 188 108" fill="none">
      <line x1="-86" y1="0" x2="86" y2="0" stroke="#5a5a5a" stroke-width="2.5"/>
      <path d="M -78 0 A 78 78 0 0 1 78 0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
      <circle cx="${sunX}" cy="${sunY}" r="8" fill="${sunColor}"/>
    </svg>`;

  // Moon: a disc lit from one side by the current phase (illuminated fraction).
  const moon = moonInfo(now);
  const MR = 30, off = (moon.waxing ? -1 : 1) * 2 * MR * moon.illum;
  const moonSvg = `<svg class="wx-moon-disc" viewBox="-34 -34 68 68">
      <defs><clipPath id="moonclip"><circle r="30"/></clipPath></defs>
      <circle r="30" fill="#1c1c1a"/>
      <circle r="30" fill="#d8d6cc" clip-path="url(#moonclip)"/>
      <circle r="30" cx="${off.toFixed(1)}" fill="#1c1c1a" clip-path="url(#moonclip)"/>
      <circle r="30" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
    </svg>`;
  const moonPct = Math.round(moon.illum * 100) + "% LIT";

  return `<div class="wx">
    <div class="wx-time">${flap(time)}<span class="wx-sec">${flap(sec)}</span></div>
    <div class="wx-date">${flap(date)}</div>
    <div class="wx-cond">${esc(flap(condLine))}</div>
    <div class="wx-cel">
      <div class="wx-sun">
        ${sunSvg}
        <div class="wx-sun-times"><span>↑ ${flap(fmtLocalHM(w.sunrise))}</span><span>↓ ${flap(fmtLocalHM(w.sunset))}</span></div>
      </div>
      <div class="wx-cel-div"></div>
      <div class="wx-moon">
        ${moonSvg}
        <div class="wx-moon-txt"><div class="nm">${flap(moon.name)}</div><div class="il">${flap(moonPct)}</div></div>
      </div>
      ${buildHumidity()}
    </div>
    <div class="wx-rain">
      <div class="wx-rain-head"><span>RAIN · NEXT 2H</span><span class="hl" style="color:${headColor}">${flap(head)}</span></div>
      <div class="wx-bars">${bars}</div>
      <div class="wx-axis"><span>NOW</span><span>+1H</span><span>+2H</span></div>
    </div>
  </div>`;
}

function render() {
  const nowd = new Date();
  document.getElementById("clock-time").textContent = nowd.toLocaleTimeString("en-GB", HMS);
  document.getElementById("clock-date").textContent = fmtDate(nowd, false);
  document.getElementById("page-label").textContent = PAGE_LABELS[page];
  // The weather page is its own big clock, so hide the small header one there.
  document.getElementById("clock").style.visibility = page === WEATHER_PAGE ? "hidden" : "visible";

  const left = document.getElementById("ftr-left");
  const right = document.getElementById("ftr-right");
  if (page === WEATHER_PAGE) {
    left.textContent = "WEATHER · OPEN-METEO";
    right.textContent = weather && weather.updated_at
      ? "UPDATED " + fmtHM(new Date(weather.updated_at))
      : "TEL AVIV";
  } else {
    left.innerHTML = FTR_LEGEND;
    right.textContent = FTR_NOTE;
  }

  const content = document.getElementById("content");
  if (page === WEATHER_PAGE) {
    content.innerHTML = buildWeather();
    return;
  }
  if (error) {
    const age = lastGood == null ? null : Math.floor((Date.now() - lastGood) / 1000);
    const ageText = age == null ? "—" : (age < 60 ? age + "S" : Math.floor(age / 60) + " MIN");
    content.innerHTML = `<div class="err">
      <div class="t">ARRIVAL DATA UNAVAILABLE</div>
      <div class="s">LAST UPDATE ${ageText} AGO · ATTEMPTING RECONNECT</div>
    </div>`;
    return;
  }
  content.innerHTML = PAGES[page].map(buildStop).join("");
  applyMarquee();
}

function applyMarquee() {
  // Seamless head-to-tail loop: duplicate the text once, gap between the
  // copies, then scroll left by exactly one copy's width forever — when the
  // first copy exits, the second is sitting exactly where the first began.
  const elapsed = (Date.now() - MARQUEE_EPOCH) / 1000;
  document.querySelectorAll(".dest").forEach(container => {
    const track = container.querySelector(".dest-track");
    const textEl = track.querySelector(".dest-text");
    const overflow = textEl.scrollWidth - container.clientWidth;
    if (overflow <= 1) return;
    track.appendChild(textEl.cloneNode(true));
    track.style.gap = `${MARQUEE_GAP_PX}px`;
    const unit = textEl.getBoundingClientRect().width + MARQUEE_GAP_PX;
    const dur = Math.max(unit / MARQUEE_SPEED_PX_S, 3);
    track.style.setProperty("--marquee-end", `-${unit}px`);
    track.style.animationDuration = `${dur.toFixed(2)}s`;
    track.style.animationDelay = `-${(elapsed % dur).toFixed(3)}s`;
    track.classList.add("scrolling");
  });
}

function fit() {
  const s = Math.min(window.innerWidth / 1024, window.innerHeight / 768);
  document.getElementById("canvas").style.transform = `translate(-50%,-50%) scale(${s})`;
}

window.addEventListener("resize", fit);
fit();
fetchData();
fetchWeather();
fetchClimate();
setInterval(render, 1000);
setInterval(fetchData, 15000);
setInterval(fetchWeather, 300000);   // weather moves slowly; refresh every 5 min
setInterval(fetchClimate, 30000);    // sensor samples every ~30 s
setInterval(startTransition, PAGE_SECONDS * 1000);
</script>
</body>
</html>
